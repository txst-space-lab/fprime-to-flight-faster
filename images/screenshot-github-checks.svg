<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="2200" height="912" viewBox="0 0 2200 912"
     font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>GitHub pull request checks: 2 failing, 5 successful</title>

  <defs>
    <!-- GitHub mark, 16x16 source grid -->
    <path id="gh-mark" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.012 8.012 0 0 0 16 8c0-4.42-3.58-8-8-8z"/>

    <!-- avatar: bordered box with GitHub mark -->
    <g id="avatar">
      <rect x="0" y="0" width="56" height="56" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="2.5"/>
      <use href="#gh-mark" transform="translate(10 10) scale(2.25)" fill="#e6edf3"/>
    </g>

    <!-- failing: red disc with white x -->
    <g id="icon-fail">
      <circle cx="0" cy="0" r="21" fill="#f85149"/>
      <path d="M-9 -9 L9 9 M9 -9 L-9 9" stroke="#0d1117" stroke-width="5.5" stroke-linecap="round"/>
    </g>

    <!-- success: green check -->
    <g id="icon-pass">
      <path d="M-16 1 L-5 12 L16 -11" fill="none" stroke="#3fb950" stroke-width="5.5"
            stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- disclosure chevron -->
    <path id="chevron" d="M-10 -5 L0 5 L10 -5" fill="none" stroke="#e6edf3"
          stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  </defs>

  <rect width="2200" height="912" fill="#0d1117"/>

  <!-- ===== header ===== -->
  <rect x="0" y="0" width="2200" height="150" fill="#161b22"/>
  <line x1="0" y1="150" x2="2200" y2="150" stroke="#30363d" stroke-width="2.5"/>

  <!-- mixed-status ring: red segment over green -->
  <g transform="translate(58 72)">
    <circle r="36" fill="none" stroke="#3fb950" stroke-width="12"/>
    <path d="M0 -36 A36 36 0 0 0 -25.5 25.5" fill="none" stroke="#f85149" stroke-width="12"/>
  </g>

  <text x="128" y="64" font-size="38" font-weight="700" fill="#e6edf3">Checks awaiting conflict resolution</text>
  <text x="128" y="119" font-size="31" fill="#8b949e">2 failing, 5 successful checks</text>

  <!-- ===== failing section ===== -->
  <text x="20" y="209" font-size="31" fill="#e6edf3">2 failing checks</text>
  <use href="#chevron" transform="translate(296 200)"/>

  <!-- row 1 -->
  <g transform="translate(0 220)">
    <use href="#icon-fail" transform="translate(56 44)"/>
    <use href="#avatar" transform="translate(100 16)"/>
    <text x="172" y="57" font-size="34" fill="#e6edf3">
      <tspan font-weight="600">ci / integration (pull_request)</tspan>
      <tspan dx="22" fill="#8b949e">Failing after 2s</tspan>
    </text>
    <text x="2176" y="57" font-size="34" fill="#4493f8" text-anchor="end">Details</text>
    <line x1="20" y1="88" x2="2200" y2="88" stroke="#30363d" stroke-width="2"/>
  </g>

  <!-- row 2 -->
  <g transform="translate(0 308)">
    <use href="#icon-fail" transform="translate(56 44)"/>
    <use href="#avatar" transform="translate(100 16)"/>
    <text x="172" y="57" font-size="34" fill="#e6edf3">
      <tspan font-weight="600">ci / integration-radio (pull_request)</tspan>
      <tspan dx="22" fill="#8b949e">Failing after 2m</tspan>
    </text>
    <text x="2176" y="57" font-size="34" fill="#4493f8" text-anchor="end">Details</text>
  </g>

  <!-- ===== successful section ===== -->
  <text x="20" y="453" font-size="31" fill="#e6edf3">5 successful checks</text>
  <use href="#chevron" transform="translate(376 444)"/>

  <!-- row 3 -->
  <g transform="translate(0 472)">
    <use href="#icon-pass" transform="translate(56 44)"/>
    <use href="#avatar" transform="translate(100 16)"/>
    <text x="172" y="57" font-size="34" fill="#e6edf3">
      <tspan font-weight="600">ci / build (pull_request)</tspan>
      <tspan dx="22" fill="#8b949e">Successful in 2m</tspan>
    </text>
    <text x="2176" y="57" font-size="34" fill="#4493f8" text-anchor="end">Details</text>
    <line x1="20" y1="88" x2="2200" y2="88" stroke="#30363d" stroke-width="2"/>
  </g>

  <!-- row 4 -->
  <g transform="translate(0 560)">
    <use href="#icon-pass" transform="translate(56 44)"/>
    <use href="#avatar" transform="translate(100 16)"/>
    <text x="172" y="57" font-size="34" fill="#e6edf3">
      <tspan font-weight="600">ci / integration-uart (pull_request)</tspan>
      <tspan dx="22" fill="#8b949e">Successful in 5m</tspan>
    </text>
    <text x="2176" y="57" font-size="34" fill="#4493f8" text-anchor="end">Details</text>
    <line x1="20" y1="88" x2="2200" y2="88" stroke="#30363d" stroke-width="2"/>
  </g>

  <!-- row 5 -->
  <g transform="translate(0 648)">
    <use href="#icon-pass" transform="translate(56 44)"/>
    <use href="#avatar" transform="translate(100 16)"/>
    <text x="172" y="57" font-size="34" fill="#e6edf3">
      <tspan font-weight="600">ci / lint (pull_request)</tspan>
      <tspan dx="22" fill="#8b949e">Successful in 34s</tspan>
    </text>
    <text x="2176" y="57" font-size="34" fill="#4493f8" text-anchor="end">Details</text>
    <line x1="20" y1="88" x2="2200" y2="88" stroke="#30363d" stroke-width="2"/>
  </g>

  <!-- row 6 -->
  <g transform="translate(0 736)">
    <use href="#icon-pass" transform="translate(56 44)"/>
    <use href="#avatar" transform="translate(100 16)"/>
    <text x="172" y="57" font-size="34" fill="#e6edf3">
      <tspan font-weight="600">ci / unit-test (pull_request)</tspan>
      <tspan dx="22" fill="#8b949e">Successful in 1m</tspan>
    </text>
    <text x="2176" y="57" font-size="34" fill="#4493f8" text-anchor="end">Details</text>
    <line x1="20" y1="88" x2="2200" y2="88" stroke="#30363d" stroke-width="2"/>
  </g>

  <!-- row 7 -->
  <g transform="translate(0 824)">
    <use href="#icon-pass" transform="translate(56 44)"/>
    <use href="#avatar" transform="translate(100 16)"/>
    <text x="172" y="57" font-size="34" fill="#e6edf3">
      <tspan font-weight="600">ci / yamcs-build (pull_request)</tspan>
      <tspan dx="22" fill="#8b949e">Successful in 18s</tspan>
    </text>
    <text x="2176" y="57" font-size="34" fill="#4493f8" text-anchor="end">Details</text>
  </g>
</svg>
